[project]
name = "ai-visibility-audit-dashboard"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.18.5",
  "authlib>=1.7.2",
  "fastapi>=0.140.0",
  "httpx>=0.28.1",
  "itsdangerous>=2.2.0",
  "opentelemetry-api>=1.44.0",
  "opentelemetry-exporter-otlp-proto-http>=1.43.0",
  "opentelemetry-instrumentation-fastapi>=0.64b0",
  "opentelemetry-instrumentation-sqlalchemy>=0.64b0",
  "opentelemetry-sdk>=1.43.0",
  "prometheus-client>=0.26.0",
  "psycopg[binary]>=3.3.4",
  "pydantic-settings>=2.14.2",
  "sqlalchemy>=2.0.51",
  "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
  "bandit>=1.9.4",
  "mypy>=2.3.0",
  "pip-audit>=2.10.1",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "ruff>=0.16.0",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-q --cov=app --cov-report=term-missing --cov-fail-under=85"
pythonpath = ["backend"]

[tool.coverage.run]
omit = [
  "*/app/refresh_simulated_audits.py",
  "*/app/restricted_role_smoke.py",
  "*/app/session_cleanup.py",
  "*/app/worker.py",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["backend/alembic"]
